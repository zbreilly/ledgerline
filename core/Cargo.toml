[package]
name = "ledgerline_core"
version = "0.1.0"
edition = "2021"
description = "Ledgerline business logic: import, dedupe, rules, merchant memory, reports"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "ledgerline_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
sha1 = "0.11"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
